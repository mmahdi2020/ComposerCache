name: Full Cache Transfer (Composer & NPM)

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'نام پروژه برای نام‌گذاری فایل‌ها'
        required: true
        default: 'full-dev-stack'

permissions:
  contents: write

jobs:
  gather-all-data:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment (PHP 8.3 & Node 20)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, mbstring, openssl, pdo, mysql, bcmath, ctype, xml, zip, gd, intl
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fill Caches (Maximum Warmup)
        # اینجا پکیج‌های حجیم و متادیتای آن‌ها را لود می‌کنیم
        run: |
          # کش کردن لاراول و تمام وابستگی‌های استاندارد
          composer create-project laravel/laravel warmup-project --no-install --no-scripts
          cd warmup-project
          composer install --prefer-dist --no-scripts --no-progress
          cd ..
          
          # کش کردن ابزارهای NPM (می‌توانید لیست را طولانی‌تر کنید)
          npm install -g next react react-dom tailwindcss typescript vite

      - name: Archive Everything (Full Metadata & Files)
        shell: pwsh
        run: |
          $prefix = "${{ github.event.inputs.project_name }}"
          
          # آدرس‌های حیاتی در ویندوز
          $composerFullDir = "$env:LOCALAPPDATA\Composer"
          $npmFullDir = "$env:LOCALAPPDATA\npm-cache"

          Write-Host "Archiving Composer from: $composerFullDir"
          # فشرده‌سازی کل پوشه Composer (شامل repo, files, vcs و غیره)
          if (Test-Path $composerFullDir) {
              7z a -v85m "${prefix}_composer_full.7z" "$composerFullDir\*"
          }

          Write-Host "Archiving NPM Cache from: $npmFullDir"
          # فشرده‌سازی کل پوشه npm-cache
          if (Test-Path $npmFullDir) {
              7z a -v85m "${prefix}_npm_full.7z" "$npmFullDir\*"
          }

      - name: Configure Git
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Commit and Push Chunks (Robust Loop)
        shell: pwsh
        run: |
          $prefix = "${{ github.event.inputs.project_name }}"
          
          # اضافه کردن تمام پارت‌های ساخته شده
          git add "${prefix}_composer_full.7z.*"
          git add "${prefix}_npm_full.7z.*"

          $status = git status --porcelain
          if ($status) {
              git commit -m "Upload complete cache metadata and files for ${prefix}"
              
              $push_success = $false
              for ($i = 1; $i -le 15; $i++) {
                  Write-Host "Attempt $i to push..."
                  # استفاده از --force برای اطمینان در صورت تداخل با رانرهای قبلی
                  git push origin HEAD --force 
                  if ($LASTEXITCODE -eq 0) {
                      $push_success = $true
                      break
                  }
                  Write-Host "Push failed. Waiting 20s..."
                  Start-Sleep -Seconds 20
                  git fetch origin
                  git rebase origin/main
              }
              if (-not $push_success) { exit 1 }
          } else {
              Write-Host "Nothing to upload."
          }
