name: Windows Composer Cache Gatherer

on:
  workflow_dispatch:

jobs:
  gather-cache:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # ارتقا به 8.3 برای حمایت از آخرین نسخه لاراول
          extensions: fileinfo, mbstring, openssl, pdo, mysql, bcmath, ctype, xml, zip, gd, intl
          # فعال‌سازی اکستنشن‌های ضروری لاراول در فایل php.ini رانر

      - name: Install Packages (Warmup)
        run: |
          # استفاده از --no-scripts برای جلوگیری از اجرای دستورات آرتیسان قبل از نصب کامل
          # استفاده از --ignore-platform-reqs برای اطمینان از دانلود شدن پکیج‌ها تحت هر شرایطی
          composer create-project laravel/laravel my-project --no-install --no-scripts
          
          cd my-project
          
          # دانلود پکیج‌ها بدون اجرای اسکریپت‌ها (فقط برای پر کردن پوشه Cache)
          composer install --prefer-dist --no-scripts --no-progress

      - name: Compress and Split Cache (7-Zip)
        shell: pwsh
        run: |
          $cachePath = "$env:LOCALAPPDATA\Composer\files"
          if (Test-Path $cachePath) {
              7z a -v90m composer_cache_parts.7z "$cachePath\*"
          } else {
              Write-Error "Cache directory not found!"
              exit 1
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: composer-windows-cache
          path: composer_cache_parts.7z.*
